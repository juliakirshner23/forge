<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORGE · Reset</title>
<style>
  body { background: #000; color: #f59e0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding: 40px 20px; text-align: center; min-height: 100vh; margin: 0; }
  h1 { font-size: 20px; letter-spacing: 4px; font-weight: 900; margin-bottom: 20px; }
  p { color: #a3a3a3; font-size: 13px; line-height: 1.5; max-width: 320px; margin: 0 auto 20px; }
  .log { color: #737373; font-size: 11px; text-align: left; max-width: 320px; margin: 24px auto; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .log div { padding: 3px 0; border-bottom: 1px solid #292524; }
  .ok  { color: #22c55e; }
  .err { color: #dc2626; }
  a.btn { display: inline-block; background: #f59e0b; color: #000; padding: 14px 24px; font-size: 12px; font-weight: 900; letter-spacing: 3px; text-decoration: none; margin-top: 20px; }
</style>
</head>
<body>
  <h1>FORGE · RESET</h1>
  <p>This clears only this app's service worker and caches. Your saved data (IndexedDB) is untouched. Nothing else in your browser is affected.</p>
  <div class="log" id="log"></div>
  <a href="./" class="btn" id="return-btn" style="display:none;">RETURN TO APP</a>

<script>
const log = document.getElementById('log');
function line(msg, cls) {
  const el = document.createElement('div');
  if (cls) el.className = cls;
  el.textContent = msg;
  log.appendChild(el);
}

(async () => {
  try {
    // 1. Unregister every service worker for this origin+scope
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      line('service workers found: ' + regs.length);
      for (const r of regs) {
        const scope = r.scope || '(unknown)';
        await r.unregister();
        line('unregistered: ' + scope, 'ok');
      }
    } else {
      line('no service worker support');
    }

    // 2. Delete every cache bucket
    if ('caches' in window) {
      const keys = await caches.keys();
      line('caches found: ' + keys.length);
      for (const k of keys) {
        await caches.delete(k);
        line('cleared: ' + k, 'ok');
      }
    } else {
      line('no cache api support');
    }

    line('DONE — reload the app', 'ok');
    document.getElementById('return-btn').style.display = 'inline-block';
  } catch (err) {
    line('error: ' + err.message, 'err');
  }
})();
</script>
</body>
</html>
