<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="FORGE — your personal strength & recovery tracker.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FORGE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=9">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">FORGE</span>
    <a href="#/me" class="topbar-me" id="topbar-me">
      <span class="topbar-me-label">ME</span>
      <span class="topbar-meta" id="topbar-meta">v0.4.1</span>
    </a>
  </div>
</header>

<main id="app-content"><div class="loading-screen">LOADING...</div></main>

<nav class="tabbar">
  <a href="#/home"  class="tab" data-route="/home"><span class="tab-icon">▤</span><span class="tab-label">HOME</span></a>
  <a href="#/plan"  class="tab" data-route="/plan"><span class="tab-icon">◆</span><span class="tab-label">PLAN</span></a>
  <a href="#/log"   class="tab" data-route="/log"><span class="tab-icon">▶</span><span class="tab-label">LOG</span></a>
  <a href="#/food"  class="tab" data-route="/food"><span class="tab-icon">◉</span><span class="tab-label">FOOD</span></a>
  <a href="#/stats" class="tab" data-route="/stats"><span class="tab-icon">▲</span><span class="tab-label">STATS</span></a>
</nav>

<input type="file" id="file-input" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal-scrim" class="modal-scrim" hidden>
  <div class="modal">
    <div class="modal-title" id="modal-title">CONFIRM</div>
    <div class="modal-body" id="modal-body">Are you sure?</div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modal-cancel">CANCEL</button>
      <button class="btn btn-danger" id="modal-confirm">CONFIRM</button>
    </div>
  </div>
</div>

<div id="inspector-scrim" class="modal-scrim" hidden>
  <div class="modal modal-tall">
    <div class="modal-title" id="inspector-title">INSPECT</div>
    <div class="modal-body inspector-body" id="inspector-body"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="inspector-close">CLOSE</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js?v=9"></script>
</body>
</html>
